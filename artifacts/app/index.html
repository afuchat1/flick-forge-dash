<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Meta Tags -->
    <title>AfuChat Movies — Movie & TV Discovery Library</title>
    <meta name="title" content="AfuChat Movies — Movie & TV Discovery Library" />
    <meta name="description" content="Discover movies and TV shows with full documentation: cast, crew, box office, ratings, trailers, keywords and where to watch. A research-grade film library." />
    <meta name="keywords" content="movie discovery, film database, movie info, cast and crew, box office, TV show guide, episode guide, movie ratings, where to watch, film library" />
    <meta name="author" content="AfuChat Movies" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical is set per-route via react-helmet-async -->


    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://movies.afuchat.com/" />
    <meta property="og:title" content="AfuChat Movies — Movie & TV Discovery Library" />
    <meta property="og:description" content="Explore films and series in depth: cast, crew, box office, ratings, trailers and where to watch. Discovery only — no streaming." />
    <meta property="og:site_name" content="AfuChat Movies" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://movies.afuchat.com/" />
    <meta name="twitter:title" content="AfuChat Movies — Movie & TV Discovery Library" />
    <meta name="twitter:description" content="Explore films and series in depth: cast, crew, box office, ratings, trailers and where to watch." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#e51414" />
    <meta name="msapplication-TileColor" content="#e51414" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AfuChat Movies",
      "alternateName": ["AfuChat", "AfuChat Movie Discovery"],
      "url": "https://movies.afuchat.com/",
      "description": "A movie and TV discovery library with in-depth documentation on every title: cast, crew, box office, ratings, trailers and where to watch.",
      "publisher": {
        "@type": "Organization",
        "name": "AfuChat Movies",
        "url": "https://movies.afuchat.com/",
        "logo": "https://movies.afuchat.com/logo.png"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://movies.afuchat.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
